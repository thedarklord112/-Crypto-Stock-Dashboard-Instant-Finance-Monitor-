<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketPulse - Premium Financial Dashboard</title>
  
  <!-- Chart.js via CDN -->
  <script src="https://jsdelivr.net"></script>

  <!-- Premium Native CSS Styling -->
  <style>
    :root {
      --bg-main: #020617;
      --bg-card: #0f172a;
      --bg-card-hover: #1e293b;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --color-emerald: #10b981;
      --color-rose: #f43f5e;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      box-sizing: border-box;
    }

    #loading {
      position: fixed;
      inset: 0;
      background-color: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.3s ease, pointer-events 0.3s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(16, 185, 129, 0.1);
      border-bottom-color: var(--color-emerald);
      border-radius: 50%;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    header {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 24px;
      margin-bottom: 32px;
      gap: 16px;
    }

    @media (min-width: 768px) {
      header { flex-direction: row; align-items: center; }
    }

    .title-area h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--color-emerald);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(16, 185, 129, 0.2);
      text-transform: uppercase;
    }

    header p {
      margin: 4px 0 0 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .time-tracker {
      text-align: left;
      font-size: 12px;
      color: var(--text-muted);
    }

    @media (min-width: 768px) {
      .time-tracker { text-align: right; }
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 1024px) {
      .grid-layout { grid-template-columns: 350px 1fr; }
    }

    .watchlist-section h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin: 0 0 12px 4px;
    }

    .watchlist-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .asset-btn {
      background-color: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      width: 100%;
    }

    .asset-btn:hover {
      border-color: #334155;
      background-color: var(--bg-card-hover);
    }

    .asset-btn.active {
      background-color: var(--bg-card);
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.05);
    }

    .asset-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .asset-meta img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .asset-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }

    .asset-symbol {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: monospace;
      margin: 2px 0 0 0;
    }

    .asset-values {
      text-align: right;
    }

    .asset-price {
      font-weight: 700;
      font-family: monospace;
      font-size: 14px;
    }

    .price-change {
      font-size: 12px;
      font-weight: 600;
      font-family: monospace;
      margin: 2px 0 0 0;
    }

    .text-green { color: var(--color-emerald); }
    .text-red { color: var(--color-rose); }

    .chart-panel {
      background-color: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .chart-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chart-title-box img {
      width: 28px;
      height: 28px;
    }

    .chart-title-box h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .chart-hero-price {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-top: 8px;
    }

    .hero-price {
      font-size: 32px;
      font-weight: 900;
      font-family: monospace;
    }

    .hero-change {
      font-size: 14px;
      font-weight: 700;
      font-family: monospace;
    }

    .chart-wrapper {
      flex-grow: 1;
      min-height: 320px;
      position: relative;
      width: 100%;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(30, 41, 59, 0.6);
    }

    @media (min-width: 640px) {
      .stats-row { grid-template-columns: repeat(3, 1fr); }
      .span-full-mobile { grid-column: auto; }
    }

    @media (max-width: 639px) {
      .span-full-mobile { grid-column: span 2; }
    }

    .stat-card {
      background-color: rgba(2, 6, 23, 0.4);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #0f172a;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      margin: 0 0 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-weight: 700;
      font-family: monospace;
      font-size: 14px;
      color: #cbd5e1;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Loading State Panel Overlay -->
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <div class="dashboard-container">
    <header>
      <div class="title-area">
        <h1>📈 MarketPulse <span class="badge-live">Live</span></h1>
        <p>Real-time asset tracking overview powered by CoinGecko API</p>
      </div>
      <div class="time-tracker">
        <div style="opacity: 0.6;">System Active Connection</div>
        <div style="font-weight: 600; margin-top: 2px;">Auto-refreshes every 60s</div>
      </div>
    </header>

    <div class="grid-layout">
      <div class="watchlist-section">
        <h2>Watchlist</h2>
        <div id="watchlist" class="watchlist-list"></div>
      </div>

      <div class="chart-panel">
        <div class="chart-header">
          <div>
            <div class="chart-title-box">
              <img id="active-icon" src="" alt="" style="display: none;" />
              <h2 id="active-title">Select an Asset</h2>
            </div>
            <div class="chart-hero-price">
              <span id="active-price" class="hero-price"></span>
              <span id="active-change" class="hero-change"></span>
            </div>
          </div>
        </div>

        <div class="chart-wrapper">
          <canvas id="cryptoChart"></canvas>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <p class="stat-label">Market Cap</p>
            <p id="stat-cap" class="stat-value">--</p>
          </div>
          <div class="stat-card">
            <p class="stat-label">24h High</p>
            <p id="stat-high" class="stat-value text-green">--</p>
          </div>
          <div class="stat-card span-full-mobile">
            <p class="stat-label">24h Low</p>
            <p id="stat-low" class="stat-value text-red">--</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cryptoIds = ['bitcoin', 'ethereum', 'solana', 'cardano'];
    let globalMarketData = [];
    let currentChart = null;

    async function fetchMarketData() {
      try {
        const response = await fetch(
          `https://coingecko.com{cryptoIds.join(',')}&order=market_cap_desc&sparkline=true&price_change_percentage=24h`
        );
        const data = await response.json();
        globalMarketData = data;
        
        renderWatchlist();
        
        if (data.length > 0) {
          selectCrypto(data[0].id);
        }

        const loader = document.getElementById('loading');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 300);
      } catch (error) {
        console.error("Connection rate limits triggered:", error);
      }
    }

    function renderWatchlist() {
      const container = document.getElementById('watchlist');
      container.innerHTML = '';

      globalMarketData.forEach(coin => {
        const priceUp = coin.price_change_percentage_24h >= 0;
        const button = document.createElement('button');
        button.className = `asset-btn`;
        button.id = `btn-${coin.id}`;
        button.onclick = () => selectCrypto(coin.id);

        button.innerHTML = `
